name: zombie-drive

x-service: &service
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

services:
    db:
        <<: *service
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        environment:
            POSTGRES_DB: zombie_drive
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a hexadecimal APP_DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres", "-d", "zombie_drive", "-h", "127.0.0.1"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s

    app:
        <<: *service
        image: ${APP_IMAGE:-zombie-drive:alpha-1}
        build: .
        init: true
        environment:
            NODE_ENV: production
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            HOST: 0.0.0.0
            PORT: "3001"
            APP_ORIGIN: https://${APP_HOST:?Set APP_HOST in .env}
            DATABASE_URL: postgresql://zombie_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/zombie_drive
        depends_on:
            db:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - >-
                    fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(4000)})
                    .then(response => process.exit(response.ok ? 0 : 1))
                    .catch(() => process.exit(1))
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 30s

    proxy:
        <<: *service
        image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
        environment:
            APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            app:
                condition: service_healthy

volumes:
    postgres_data:
    caddy_data:
    caddy_config:
